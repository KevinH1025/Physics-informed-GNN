data:
  train_path: datasets/opamp_3stage_pretrain_combined/dataset_train.pkl
  val_path: datasets/opamp_3stage_pretrain_combined/dataset_val.pkl

model:
  hidden_dim: 128
  genconv_num_layers: 2
  norm_type: layer
  act_type: gelu
  skip_connection: false   # pretraining backbone only — no skip pathway
  dropout: 0.0
  conv_type: gin
  mlp_depth: 3
  tower:
    backbone_layers: 8
    loop_attention:
      enabled: true
      num_heads: 4
      head_dim: 32
      fusion: gate
      warmup_epochs: 0       # no warmup for pretraining — turn on from start
      warmup_duration: 0
  virtual_node:
    enabled: true
    mode: mha
    num_heads: 4
    head_dim: 32
    gate_broadcast: true

pretrain:
  mask_ratio: 0.60           # fraction of MOSFETs masked per sample
  mask_target_dim: 4         # W, L, wl_ratio, M
  mask_head_hidden: 128

optimizer:
  lr: 0.001
  weight_decay: 0.0

scheduler:
  type: plateau
  patience: 30
  factor: 0.5
  min_lr: 1.0e-6

training:
  epochs: 200
  batch_size: 64           # 16 graphs per topology × 4 topologies
  gradient_clip: 1.0
  val_freq: 1

output:
  log_interval: 1
