data:
  train_path: datasets/opamp_3stage_pretrain_combined/dataset_train.pkl
  val_path: datasets/opamp_3stage_pretrain_combined/dataset_val.pkl

model:
  hidden_dim: 128
  genconv_num_layers: 2
  norm_type: layer
  act_type: gelu
  skip_connection: false
  dropout: 0.0
  conv_type: gin
  mlp_depth: 3
  tower:
    backbone_layers: 8
    loop_attention:
      enabled: true
      num_heads: 4
      head_dim: 32
      fusion: gate
      warmup_epochs: 0
      warmup_duration: 0
  virtual_node:
    enabled: true
    mode: mha
    num_heads: 4
    head_dim: 32
    gate_broadcast: true

# SimCLR-style contrastive learning
contrastive:
  proj_dim: 64               # projection-head output dimension
  feature_noise: 0.02        # σ of Gaussian noise on x cols 0-3 per view
  edge_drop: 0.10            # fraction of edges dropped per view
  temperature: 0.5           # NT-Xent temperature

optimizer:
  lr: 0.001
  weight_decay: 0.0

scheduler:
  type: plateau
  patience: 30
  factor: 0.5
  min_lr: 1.0e-6

training:
  epochs: 200
  batch_size: 64
  gradient_clip: 1.0

output:
  log_interval: 1
