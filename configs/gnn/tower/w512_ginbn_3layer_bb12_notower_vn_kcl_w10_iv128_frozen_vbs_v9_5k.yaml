data:
  path: datasets/opamp_3stage_fan_smc_v9_5k_nofil
  prebatched: true
  max_preload_variants: 10
  preload_to_gpu: true
model:
  type: tower_genconv
  hidden_dim: 128
  genconv_num_layers: 2
  norm_type: layer
  act_type: gelu
  skip_connection: true
  gradient_checkpointing: false
  dropout: 0.0
  tower:
    backbone_layers: 12
    state_tower_layers: 0
    sensitivity_tower_layers: 0
    backbone_jk:
      mode: cat
      attention: true
    state_tower_jk:
      mode: last
    sensitivity_tower_jk:
      mode: last
    loop_attention:
      enabled: true
      num_heads: 4
      head_dim: 32
      apply_to: backbone
      fusion: gate
      warmup_epochs: 350
      warmup_duration: 200
  virtual_node:
    enabled: true
    mode: mha
    num_heads: 4
    head_dim: 32
    gate_broadcast: true
  heads:
    voltage:
      num_layers: 1
      hidden_dim: 128
      dropout: 0.0
    current:
      enabled: true
      num_layers: 2
      hidden_dim: 128
      dropout: 0.0
      device_pooling: true
    ss:
      enabled: true
      num_layers: 2
      hidden_dim: 512
      voltage_context: true
      current_context: true
      include_bulk: true
    dc_gain:
      enabled: true
      mode: physics
      hidden_dim: 128
      num_layers: 2
      detach_ss: true
      r_in: 50000.0
      r_f: 50000.0
    ac:
      enabled: false
    current_gnn:
      enabled: false
  conv_type: gin
  mlp_depth: 3
  iv_embedder:
    enabled: true
    run_dir: datasets/lut/lut_v2/iv_autoencoder/plateau_b128_bs512_ep4000_wm10_allvbs
    lut_path: datasets/lut/lut_v2/sky130_mosfet_lut_v2_id_gm_gds.h5
    freeze: true
    use_vbs: true
loss:
  type: mse
  huber_delta: 1.0
  current_weight: 1.0
  current_warmup_epochs: 0
  kcl_weight: 1.0
  kcl_gt_filter: 0.0
  kcl_intermediate_weight: 0.0
  stage2_weight: 1.0
  stage2_nodes:
  - vout
  - vout_stage1
  - vg2
  - vc
  current_constraints:
    weight: 0.0
  gm_physics_loss:
    weight: 0.0
  triode_physics_loss:
    weight: 0.0
  ss_loss:
    gm_weight: 1.0
    gds_weight: 1.0
  ac_loss:
    weight: 0.0
  dc_gain_loss:
    weight: 1.0
  kcl_start_epoch: 200
optimizer:
  lr: 0.003
  weight_decay: 0.0
scheduler:
  type: plateau
  warmup_epochs: 50
  patience: 150
  factor: 0.5
  min_lr: 1.0e-06
training:
  epochs: 5000
  batch_size: 1
  gradient_clip: 1.0
  val_freq: 1
  early_stopping_patience: 500
  seed: 88
normalization:
  target_type: zscore
  vdd: 1.8
output:
  save_best: true
  save_final: false
  log_interval: 5
