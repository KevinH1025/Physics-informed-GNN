data:
  path: datasets/opamp_3stage_fan_smc_v9_5k_nofil
  prebatched: true
  max_preload_variants: 10
  preload_to_gpu: true
model:
  type: tower_genconv
  hidden_dim: 128
  genconv_num_layers: 2
  norm_type: layer
  act_type: gelu
  skip_connection: false
  gradient_checkpointing: false
  dropout: 0.0
  tower:
    backbone_layers: 8
    state_tower_layers: 0
    sensitivity_tower_layers: 0
    backbone_jk:
      mode: last
    state_tower_jk:
      mode: last
    sensitivity_tower_jk:
      mode: last
    loop_attention:
      enabled: false
  virtual_node:
    enabled: true
    mode: mha
    num_heads: 4
    head_dim: 32
    gate_broadcast: true
  heads:
    voltage:
      num_layers: 1
      hidden_dim: 128
      dropout: 0.0
    current:
      enabled: true
      num_layers: 2
      hidden_dim: 128
      dropout: 0.0
      device_pooling: false
    ss:
      enabled: true
      num_layers: 2
      hidden_dim: 128
      voltage_context: false
      current_context: false
      include_bulk: false
      drain_only: true
    dc_gain:
      enabled: true
      mode: pool
      hidden_dim: 128
    ac:
      enabled: false
    current_gnn:
      enabled: false
  conv_type: gatv2
  conv_num_heads: 4
loss:
  type: mse
  huber_delta: 1.0
  current_weight: 1.0
  current_warmup_epochs: 0
  kcl_weight: 0.0
  ss_loss:
    gm_weight: 1.0
    gds_weight: 1.0
  dc_gain_loss:
    weight: 1.0
optimizer:
  lr: 0.003
  weight_decay: 0.0
scheduler:
  type: plateau
  warmup_epochs: 50
  patience: 150
  factor: 0.5
  min_lr: 1.0e-06
training:
  epochs: 5000
  batch_size: 1
  gradient_clip: 1.0
  val_freq: 1
  early_stopping_patience: 500
  seed: 42
normalization:
  target_type: zscore
  vdd: 1.8
output:
  save_best: true
  save_final: false
  log_interval: 5
