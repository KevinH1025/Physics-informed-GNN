# Op-Amp 3-Stage Peng TCFC Dataset Configuration — 5k samples
# Topology: PMOS folded-cascode + cascoded bias chain + dual-cap TCFC compensation
# 32 MOSFETs, 7 groups (BIASCM_N, BIASCM_P, GM1, GM2, GM3, GMF, LOAD2).
# device_to_group is OMITTED — auto-derived by netlist_parser.
#
# Distinct parameters vs fan_smc:
#   - C_COMP2 (feedforward cap on net049 → vout)
#   - GMF (stage-3 PMOS group, not GMF2 — single-letter to match user's gmf naming)
#
# Usage:
#   python scripts/generate_dataset.py \
#     --config configs/opamp_dataset/opamp_3stage_peng_tcfc_5k.yaml \
#     --output-dir datasets/opamp_3stage_peng_tcfc_5k

dataset:
  name: opamp_3stage_peng_tcfc
  template: netlists/opamp_3stage_peng_tcfc_template.sp
  ac_template: netlists/opamp_3stage_peng_tcfc_ac_template.sp
  description: Three-stage Peng TCFC op-amp — wide parameter ranges, 5k samples

graph_encoding:
  normalize_props: true

# device_to_group: omitted — auto-derived from netlist by netlist_parser

excluded_current_devices:
  - vcm_ref
  - lbreak
  - vac_inj

pre_batching:
  enabled: true
  batch_size: 1024
  num_batching_variants: 10
  seed: 42
  train: 0.8
  val: 0.2
  test: 0.0
  split_seed: 88

sampling:
  method: lhs
  total_samples: 5000
  max_attempts_multiplier: 10.0
  n_workers: 20
  save_interval: 1000

  filter:
    enabled: true
    rail_margin: 0.0
    exclude_nodes:
      - gnda
      - dm_2
      - net063
      - net31
      - net54
      - net56
    saturation_only: false

  constraints: []

parameters:
  # === MOSFET WIDTHS (log) — matches fan_smc ===
  W_BIASCM_P: { min: 0.42e-6, max: 50.0e-6, scale: log }
  W_BIASCM_N: { min: 0.42e-6, max: 50.0e-6, scale: log }
  W_GM1:      { min: 0.42e-6, max: 50.0e-6, scale: log }
  W_GM2:      { min: 0.42e-6, max: 50.0e-6, scale: log }
  W_GM3:      { min: 0.42e-6, max: 50.0e-6, scale: log }
  W_GMF:      { min: 0.42e-6, max: 50.0e-6, scale: log }   # stage-3 PMOS
  W_LOAD2:    { min: 0.42e-6, max: 50.0e-6, scale: log }

  # === MOSFET LENGTHS (log) ===
  L_BIASCM_P: { min: 0.15e-6, max: 20.0e-6, scale: log }
  L_BIASCM_N: { min: 0.15e-6, max: 20.0e-6, scale: log }
  L_GM1:      { min: 0.15e-6, max: 20.0e-6, scale: log }
  L_GM2:      { min: 0.15e-6, max: 20.0e-6, scale: log }
  L_GM3:      { min: 0.15e-6, max: 20.0e-6, scale: log }
  L_GMF:      { min: 0.15e-6, max: 20.0e-6, scale: log }
  L_LOAD2:    { min: 0.15e-6, max: 20.0e-6, scale: log }

  # === MOSFET MULTIPLIERS (log integer) ===
  # Note: netlist hardcoded multipliers can be very large (M7=48×, M66=48×)
  # so the effective multiplier reaches ~5000× for those devices.
  M_BIASCM_P: { min: 1, max: 100, scale: log, type: int }
  M_BIASCM_N: { min: 1, max: 100, scale: log, type: int }
  M_GM1:      { min: 1, max: 100, scale: log, type: int }
  M_GM2:      { min: 1, max: 100, scale: log, type: int }
  M_GM3:      { min: 1, max: 100, scale: log, type: int }
  M_GMF:      { min: 1, max: 100, scale: log, type: int }
  M_LOAD2:    { min: 1, max: 100, scale: log, type: int }

  # === BIAS CURRENT & COMPENSATION ===
  # I_BIAS / C_COMP same range as fan_smc; C_COMP2 = feedforward cap.
  I_BIAS:  { min: 0.5e-6,  max: 100.0e-6, scale: log }
  C_COMP:  { min: 0.5e-12, max: 30.0e-12, scale: log }   # Miller cap (voutp → vout, ref 1.1 pF)
  C_COMP2: { min: 0.5e-12, max: 30.0e-12, scale: log }   # feedforward cap (net049 → vout, ref 1.0 pF)

  # === OPERATING POINT ===
  VCM:   { min: 0.7, max: 0.9, scale: linear }
  VDIFF: { value: 0 }

  # === FIXED PARAMETERS ===
  VDD:  { value: 1.8 }
  R_IN: { value: 50000 }
  R_F:  { value: 50000 }
