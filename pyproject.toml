[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitgnn"
version = "1.0.0"
description = "Physics-informed GNN surrogate models for predicting analog circuit specifications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "torch-geometric>=2.7",
    "numpy>=1.26,<2",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "networkx>=3.0",
    "h5py>=3.10",
]

[project.optional-dependencies]
spice = ["PySpice>=1.5"]

[tool.setuptools]
packages = { find = { include = ["circuitgnn*"] } }
